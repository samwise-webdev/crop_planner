<!doctype html>
<html>
<head>
	<title>Whitespace Remover</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<style>
		* {
			box-sizing: border-box;
		}

		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: #f4f4f4;
			margin: 0;
			padding: 40px 20px;
			color: #333;
		}

		.container {
			max-width: 900px;
			margin: 0 auto;
		}

		h1 {
			font-size: 24px;
			margin-bottom: 20px;
		}

		.columns {
			display: flex;
			gap: 20px;
			flex-wrap: wrap;
		}

		.column {
			flex: 1;
			min-width: 280px;
			display: flex;
			flex-direction: column;
		}

		label {
			font-weight: bold;
			margin-bottom: 8px;
		}

		textarea {
			width: 100%;
			height: 300px;
			padding: 10px;
			font-family: monospace;
			font-size: 14px;
			border: 1px solid #ccc;
			border-radius: 4px;
			resize: vertical;
		}

		textarea[readonly] {
			background: #eee;
		}

		.output_wrap {
			position: relative;
		}

		button.copy_btn {
			position: absolute;
			top: 8px;
			right: 8px;
			padding: 6px 12px;
			font-size: 13px;
			border: 1px solid #ccc;
			border-radius: 4px;
			background: #fff;
			cursor: pointer;
		}

		button.copy_btn:hover {
			background: #f0f0f0;
		}

		button.copy_btn.copied {
			background: #d4edda;
			border-color: #c3e6cb;
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>Whitespace Remover</h1>

		<div class="columns">
			<div class="column">
				<label for="input_text">Input</label>
				<textarea id="input_text" placeholder="Paste your text here..."></textarea>
			</div>

			<div class="column">
				<label for="output_text">Output</label>
				<div class="output_wrap">
					<textarea id="output_text" readonly></textarea>
					<button class="copy_btn" id="copy_btn">Copy</button>
				</div>
			</div>
		</div>
	</div>

	<script>
		var input = document.getElementById('input_text');
		var output = document.getElementById('output_text');
		var copyBtn = document.getElementById('copy_btn');

		function update_output() {
			output.value = input.value.replace(/\s+/g, '');
		}

		input.addEventListener('input', update_output);

		copyBtn.addEventListener('click', function () {
			if (!output.value) {
				return;
			}

			navigator.clipboard.writeText(output.value).then(function () {
				copyBtn.textContent = 'Copied!';
				copyBtn.classList.add('copied');

				setTimeout(function () {
					copyBtn.textContent = 'Copy';
					copyBtn.classList.remove('copied');
				}, 1500);
			});
		});
	</script>
</body>
</html>
